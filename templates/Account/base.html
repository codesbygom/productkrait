{% load static %}

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="color-scheme" content="light">

  <!-- Tell the browser to be responsive to screen width -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="{% static 'shop/images/logo/productkrait-favicon-1x1.png' %}">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="{% static 'registration/adminlte/plugins/fontawesome-free/css/all.min.css' %}">
  <!-- Ionicons -->
  <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
  <!-- Tempusdominus Bbootstrap 4 -->
  <link rel="stylesheet" href="{% static 'registration/adminlte/plugins/tempusdominus-bootstrap-4/css/tempusdominus-bootstrap-4.min.css' %}">
  <!-- iCheck -->
  <link rel="stylesheet" href="{% static 'registration/adminlte/plugins/icheck-bootstrap/icheck-bootstrap.min.css' %}">
  <!-- JQVMap -->
  <link rel="stylesheet" href="{% static 'registration/adminlte/plugins/jqvmap/jqvmap.min.css' %}">
  <!-- Theme style -->
  <link rel="stylesheet" href="{% static 'registration/adminlte/dist/css/adminlte.min.css' %}">
  <!-- overlayScrollbars -->
  <link rel="stylesheet" href="{% static 'registration/adminlte/plugins/overlayScrollbars/css/OverlayScrollbars.min.css' %}">
  <!-- Daterange picker -->
  <link rel="stylesheet" href="{% static 'registration/adminlte/plugins/daterangepicker/daterangepicker.css' %}">
  <!-- summernote -->
  <link rel="stylesheet" href="{% static 'registration/adminlte/plugins/summernote/summernote-bs4.css' %}">
  <!-- Google Font: Source Sans Pro -->
  <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700" rel="stylesheet">

  <title>Admin Panel</title>

</head>
<body class="hold-transition sidebar-mini layout-fixed">
<style>
  /* Only force the fixed sidebar width/offset on desktop. Below 992px this
     was overriding AdminLTE's own off-canvas sidebar behavior with
     !important, which is why the hamburger (pushmenu) toggle looked broken
     on narrow screens: the content was always shoved right by 280px and
     the sidebar never actually got out of the way. */
  @media (min-width: 992px) {
    .sidebar {
      width: 280px !important;
    }
    .main-sidebar {
      width: 280px !important;
    }
    .content-wrapper {
      margin-left: 280px !important;
    }
    .main-header {
      margin-left: 280px !important;
    }

    /* When the hamburger (pushmenu) collapses the sidebar, AdminLTE expects
       it to shrink to an icon-only rail and the content to follow. The
       280px rules above were unconditional and outweighed that, so the
       "collapsed" sidebar stayed full width and just sat under the
       content instead of visibly closing. */
    .sidebar-collapse .main-sidebar {
      width: 4.6rem !important;
    }
    .sidebar-collapse .content-wrapper,
    .sidebar-collapse .main-header {
      margin-left: 4.6rem !important;
    }
  }
  .nav-sidebar .nav-item .nav-link {
    padding: 0.8rem 1rem;
    font-size: 1rem;
  }
  .nav-sidebar .nav-item .nav-link p {
    margin-left: 0.5rem;
  }

  /* Match the krait black/cream buttons used on the rest of the site
     instead of AdminLTE's default blue/green/red. */
  .btn-primary,
  .btn-secondary,
  .btn-success,
  .btn-danger,
  .btn-info,
  .btn-warning {
    background: linear-gradient(180deg, #33383c 0%, #1c1f22 55%, #101214 100%) !important;
    border-color: rgba(0, 0, 0, 0.2) !important;
    color: #f0ead6 !important;
    border-radius: 10px !important;
  }

  .btn-primary:hover, .btn-primary:focus,
  .btn-secondary:hover, .btn-secondary:focus,
  .btn-success:hover, .btn-success:focus,
  .btn-danger:hover, .btn-danger:focus,
  .btn-info:hover, .btn-info:focus,
  .btn-warning:hover, .btn-warning:focus {
    background: linear-gradient(180deg, #3d4247 0%, #24282b 55%, #16181a 100%) !important;
    color: #f0ead6 !important;
  }

  .brand-link {
    display: flex;
    align-items: center;
  }

  /* Same black/cream krait palette as the shop navbar and the login/signup
     cards, applied to the admin panel's topbar, sidebar and page body. */
  .krait-admin-navbar {
    background: linear-gradient(180deg, #131517 0%, #0a0b0c 60%, #000000 100%) !important;
  }

  .main-sidebar {
    background: linear-gradient(180deg, #1c1f22 0%, #0a0c0e 65%, #000000 100%) !important;
  }

  /* Pin "Log out" to the true bottom of the sidebar: without the brand-link
     row up top, the sidebar now starts at the user panel, and the nav list
     needs to stretch the full sidebar height for mt-auto on the last item
     to push it all the way down instead of just trailing after the menu. */
  .krait-sidebar-flex {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .krait-sidebar-flex > nav {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  .krait-sidebar-flex > nav > .nav-sidebar {
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .content-wrapper {
    background-color: #f0ead6 !important;
  }

  .content-wrapper .form-control {
    background-color: #fbf7ea !important;
    border-color: #d8cfae !important;
    color: #1a1a1a !important;
  }

  .content-wrapper .form-control:focus {
    background-color: #fffdf6 !important;
    border-color: #1a1a1a !important;
    box-shadow: none !important;
  }
</style>
<div class="wrapper">

  <!-- Navbar -->
  <nav class="main-header navbar navbar-expand navbar-dark krait-admin-navbar">
    <!-- Left navbar links -->
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="#"><i class="fas fa-bars"></i></a>
      </li>
      <li class="nav-item d-none d-sm-inline-block">
        <a href="{% url 'account:profile' %}" class="nav-link">Home</a>
      </li>
      <li class="nav-item d-none d-sm-inline-block">
        <a href="{% url 'shop:index' %}" target="_blank" class="nav-link">View Site</a>
      </li>
      <li class="nav-item d-none d-sm-inline-block">
        <a href="{% url 'account:orders' %}" class="nav-link">Order History</a>
      </li>
    </ul>

    <!-- Right navbar links -->
    <ul class="navbar-nav ml-auto align-items-center">
      <li class="nav-item">
        <a href="{% url 'shop:index' %}" class="nav-link py-0">
          <img src="{% static 'shop/images/logo/productkrait-navbar-logo.png' %}" alt="ProductKrait" style="height: 40px; width: auto;">
        </a>
      </li>
    </ul>
  </nav>
  <!-- /.navbar -->

  <!-- Main Sidebar Container -->
  
  {% include 'Account/sidebar.html' %}

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 class="m-0 text-dark">{% block title %}Page Title{% endblock %}</h1>
          </div><!-- /.col -->
          
        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </div>
    <!-- /.content-header -->

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <!-- Small boxes (Stat box) -->
        {% block main %}


        {% endblock %}
      </div><!-- /.container-fluid -->
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->
  <footer class="main-footer">
  </footer>

  <!-- Control Sidebar -->
  <aside class="control-sidebar control-sidebar-dark">
    <!-- Control sidebar content goes here -->
  </aside>
  <!-- /.control-sidebar -->
</div>
<!-- ./wrapper -->

<!-- jQuery -->
<script src="{% static 'registration/adminlte/plugins/jquery/jquery.min.js' %}"></script>
<!-- jQuery UI 1.11.4 -->
<script src="{% static 'registration/adminlte/plugins/jquery-ui/jquery-ui.min.js' %}"></script>
<!-- Resolve conflict in jQuery UI tooltip with Bootstrap tooltip -->
<script>
  $.widget.bridge('uibutton', $.ui.button)
</script>
<!-- Bootstrap 4 -->
<script src="{% static 'registration/adminlte/plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<!-- ChartJS -->
<script src="{% static 'registration/adminlte/plugins/chart.js/Chart.min.js' %}"></script>
<!-- Sparkline -->
<script src="{% static 'registration/adminlte/plugins/sparklines/sparkline.js' %}"></script>
<!-- JQVMap -->
<script src="{% static 'registration/adminlte/plugins/jqvmap/jquery.vmap.min.js' %}"></script>
<script src="{% static 'registration/adminlte/plugins/jqvmap/maps/jquery.vmap.world.js' %}"></script>
<!-- jQuery Knob Chart -->
<script src="{% static 'registration/adminlte/plugins/jquery-knob/jquery.knob.min.js' %}"></script>
<!-- daterangepicker -->
<script src="{% static 'registration/adminlte/plugins/moment/moment.min.js' %}"></script>
<script src="{% static 'registration/adminlte/plugins/daterangepicker/daterangepicker.js' %}"></script>
<!-- Tempusdominus Bootstrap 4 -->
<script src="{% static 'registration/adminlte/plugins/tempusdominus-bootstrap-4/js/tempusdominus-bootstrap-4.min.js' %}"></script>
<!-- Summernote -->
<script src="{% static 'registration/adminlte/plugins/summernote/summernote-bs4.min.js' %}"></script>
<!-- overlayScrollbars -->
<script src="{% static 'registration/adminlte/plugins/overlayScrollbars/js/jquery.overlayScrollbars.min.js' %}"></script>
<!-- AdminLTE App -->
<script src="{% static 'registration/adminlte/dist/js/adminlte.js' %}"></script>
<!-- AdminLTE dashboard demo (This is only for demo purposes) -->
<script src="{% static 'registration/adminlte/dist/js/pages/dashboard.js' %}"></script>
<!-- AdminLTE for demo purposes -->
<script src="{% static 'registration/adminlte/dist/js/demo.js' %}"></script>
</body>
</html>

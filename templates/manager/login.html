{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="{% static 'shop/images/logo/productkrait-favicon-1x1.png' %}">
  <link rel="stylesheet" href="{% static 'manager/manager.css' %}">
  <title>Manager login · ProductKrait</title>
</head>
<body class="mgr-login-body">
  <form method="post" class="mgr-login-card">{% csrf_token %}
    <img src="{% static 'shop/images/logo/productkrait-navbar-logo.png' %}" alt="ProductKrait" class="mgr-login-logo">
    <h1>Manager</h1>
    <p class="mgr-login-sub">Staff sign-in</p>

    {% for error in form.non_field_errors %}<div class="mgr-error">{{ error }}</div>{% endfor %}

    <label for="{{ form.username.id_for_label }}">Email</label>
    <input type="email" name="username" id="{{ form.username.id_for_label }}" value="{{ form.username.value|default_if_none:'' }}" autofocus required autocomplete="username">

    <label for="{{ form.password.id_for_label }}">Password</label>
    <input type="password" name="password" id="{{ form.password.id_for_label }}" required autocomplete="current-password">

    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
</body>
</html>

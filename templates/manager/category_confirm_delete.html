{% extends 'manager/base.html' %}
{% block page_title %}Delete category{% endblock %}
{% block title %}Delete category{% endblock %}
{% block main %}
<div class="card"><div class="card-body">
  <p>Delete <strong>{{ object.title }}</strong>? Its sub-categories will be deleted too. Products are kept but lose this category.</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'manager:categories' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div></div>
{% endblock %}

{% extends 'manager/base.html' %}
{% load crispy_forms_tags %}
{% block page_title %}Edit order #{{ object.pk }}{% endblock %}
{% block title %}Edit order #{{ object.pk }}{% endblock %}
{% block main %}
<div class="card"><div class="card-body">
  <form method="post">{% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-success">Save changes</button>
    <a href="{% url 'manager:order-detail' object.pk %}" class="btn btn-secondary">Cancel</a>
  </form>
</div></div>
{% endblock %}

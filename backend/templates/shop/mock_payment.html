{% extends 'shop/base.html' %}

{% block title %}Mock Payment{% endblock %}

{% block content %}
<div class="container" style="max-width: 560px; margin: 2rem auto;">
    <div class="card shadow-sm">
        <div class="card-body text-center p-4">
            <span class="badge badge-warning mb-3">Demo gateway: no real money moves</span>
            <h1 class="h3">Mock Bank</h1>
            <p class="text-muted mb-1">Amount to pay</p>
            <p class="h2">{{ amount|floatformat:"0g" }} Toman</p>
            <p class="small text-muted">Tracking code: {{ tracking_code }}</p>
            <form method="post" action="{% url 'mock-payment-result' %}" class="d-flex justify-content-center mt-4">
                {% csrf_token %}
                <button type="submit" name="result" value="success" class="btn btn-success mr-2">Pay successfully</button>
                <button type="submit" name="result" value="fail" class="btn btn-outline-danger">Simulate failure</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

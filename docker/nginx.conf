upstream django {
    server web:8000;
}

server {
    listen 80;
    client_max_body_size 10M;

    # Uploaded files are served straight from the shared volume
    location /media/ {
        alias /app/media/;
    }

    # Everything else, static files included (WhiteNoise), goes to gunicorn
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
